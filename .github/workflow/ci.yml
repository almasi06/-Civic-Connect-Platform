name: CivicConnect CI

on:
  pull_request:
    branches: [main, master, Documentation]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, Documentation, "m3/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicconnect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # FRONTEND — Typecheck, lint, build
  # ===========================================================================
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ===========================================================================
  # BACKEND — Typecheck, tests, build (with ephemeral Postgres)
  # ===========================================================================
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicconnect
          POSTGRES_PASSWORD: civicconnect
          POSTGRES_DB: civicconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicconnect -d civicconnect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      CI: true
      DISABLE_RATE_LIMIT: "1"
      PGSSL: "false"
      DATABASE_URL: postgresql://civicconnect:civicconnect@localhost:5432/civicconnect_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      API_PORT: 4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Create .env file for CI
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://civicconnect:civicconnect@localhost:5432/civicconnect_test
          JWT_SECRET=ci-test-secret-do-not-use-in-production
          NODE_ENV=test
          API_PORT=4000
          DISABLE_RATE_LIMIT=1
          PGSSL=false
          EOF

      - name: Apply database schema
        run: |
          PGPASSWORD=civicconnect psql -h localhost -U civicconnect -d civicconnect_test -f migrations/001_initial_schema.sql

      - name: Verify schema applied
        run: |
          PGPASSWORD=civicconnect psql -h localhost -U civicconnect -d civicconnect_test -c "\dt"
          PGPASSWORD=civicconnect psql -h localhost -U civicconnect -d civicconnect_test -c "SELECT email, role FROM users;"

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Start API server in background
        run: |
          npm run dev > /tmp/api.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in {1..40}; do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Server is up after $i seconds"
              curl -s http://localhost:4000/health
              break
            fi
            sleep 1
          done

      - name: Run backend tests
        run: npm test

      - name: Upload API server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-logs
          path: /tmp/api.log
          if-no-files-found: ignore

      - name: Stop API server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
